name: publish

# Runs when a GitHub release is published. Uploads to PyPI via Trusted
# Publishing (no token); the environment "pypi" waits for a reviewer's approval.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match version $version in pyproject.toml"
            exit 1
          fi

      - run: python -m pip install build twine pip-licenses
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Licenses of runtime dependencies
        # Only the wheel and what it pulls in, exactly what a customer installs.
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install dist/*.whl
          python -m piplicenses --python /tmp/check/bin/python --from=mixed --partial-match \
            --allow-only="MIT;BSD;Apache;ISC;PSF;Python Software Foundation" \
            --ignore-packages certifi pip

      - name: Run the tests against the installed wheel
        # pythonpath cleared, so "import esgo" loads the wheel, not src/.
        run: |
          /tmp/check/bin/python -m pip install pytest
          /tmp/check/bin/python -m pytest -q -p no:cacheprovider -o pythonpath= tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/esgo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
