[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "esgo"
version = "0.1.0"
description = "Official Python SDK for the ESGO API (empty-run matching for road freight)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ESGO Logistics UG (haftungsbeschränkt)" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.23,<1", "attrs>=22.2.0"]
keywords = ["esgo", "logistics", "freight", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openapi-python-client==0.29.1"]

[project.urls]
Homepage = "https://es-go.de/developers"
Documentation = "https://api.es-go.de/v1/docs"
Source = "https://github.com/ESGO-Logistics/esgo-python"
Changelog = "https://github.com/ESGO-Logistics/esgo-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/esgo"]

# Explicit list: in 0.0.1 a local .venv-1 (not matched by .gitignore) ended up
# in the sdist. Only what is listed here is shipped.
[tool.hatch.build.targets.sdist]
include = [
    "src/esgo",
    "tests",
    "scripts",
    "openapi.json",
    "openapi-python-client.yml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
